name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Run headless tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Smoke-test the editor (headless, 5s)
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1600x920x24 &
          sleep 2
          DISPLAY=:99 timeout 5 ./bin/PSPulse/PSPulse --project projects/MyPSPGame || test $? -eq 124
          echo "editor started and survived 5 seconds"

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: PSPulse-linux-x64
          path: bin/PSPulse/PSPulse
          if-no-files-found: error

  # PSPSDK toolchain build of the PSP runtime template (EBOOT.PBP).
  build-psp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSPSDK (prebuilt pspdev)
        run: |
          curl -L --fail -o pspdev.tar.gz \
            https://github.com/pspdev/pspdev/releases/latest/download/pspdev-debian-latest.tar.gz
          sudo tar -xzf pspdev.tar.gz -C /opt
          echo "PSPDEV=/opt/pspdev" >> "$GITHUB_ENV"
          echo "/opt/pspdev/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: psp-gcc --version

      - name: Build EBOOT.PBP
        working-directory: PSPRuntime
        run: |
          make clean
          make
          make dist

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-template
          path: bin/PSPRuntime/EBOOT.PBP
          if-no-files-found: error

      # End-to-end check of the editor's own pipeline: `PSPEditor --build`
      # packaging a real project into an EBOOT.PBP without a window, and
      # without a prebuilt libpsplua.a (the editor compiles Lua itself).
      - name: Build the editor
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Headless EBOOT build via the editor CLI
        run: |
          rm -rf PSPRuntime/lib projects/MyPSPGame/build
          ./bin/PSPulse/PSPulse --project projects/MyPSPGame --build
          ls -l projects/MyPSPGame/build/pkg/EBOOT.PBP

      - name: Upload project EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-MyPSPGame
          path: projects/MyPSPGame/build/pkg/EBOOT.PBP
          if-no-files-found: error
