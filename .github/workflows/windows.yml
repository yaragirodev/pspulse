name: Windows

# Builds PSPEditor.exe on a native Windows runner (MSVC), runs the headless
# tests and publishes the editor + PSP runtime template as artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest no longer ships VS 2022 (it moved to VS 2026), so pick the
      # newest installed Visual Studio generator instead of hardcoding one.
      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $ver = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $ver) { throw "No Visual Studio with the C++ workload found" }
          $major = [int]($ver.Split('.')[0])
          $gen = switch ($major) {
            17 { "Visual Studio 17 2022" }
            18 { "Visual Studio 18 2026" }
            default { throw "Unsupported Visual Studio version: $ver" }
          }
          Write-Host "Using generator: $gen (VS $ver)"
          "generator=$gen" >> $env:GITHUB_OUTPUT

      - name: Configure (MSVC, x64)
        run: cmake -S . -B build -G "${{ steps.vs.outputs.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run headless tests
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: PSPulse-windows-msvc
          path: |
            bin/PSPulse/PSPulse.exe
            README.md
            README.ru.md
          if-no-files-found: error

  # Cross-check that the MinGW toolchain also produces a runnable binary.
  build-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MinGW)
        run: cmake -S . -B build-mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-mingw -j 4

      - name: Run headless tests
        working-directory: build-mingw
        run: ctest --output-on-failure

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: PSPulse-windows-mingw
          path: bin/PSPulse/PSPulse.exe
          if-no-files-found: error
